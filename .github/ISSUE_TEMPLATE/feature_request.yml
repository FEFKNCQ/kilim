name: Feature request
description: Suggest an idea or a new rug pattern
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why would it be useful?
  - type: textarea
    id: refs
    attributes:
      label: References
      description: For new rug patterns, please add links to example images of the real rug style.
